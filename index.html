<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>七色レインボースネーク100</title>
<style>
:root{color-scheme:dark;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}body{min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#fff;background:#020617;overflow:hidden;touch-action:pan-x pan-y}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background:radial-gradient(circle at 18% 18%,#7c3aed 0,transparent 28%),radial-gradient(circle at 82% 25%,#0891b2 0,transparent 25%),radial-gradient(circle at 50% 92%,#db2777 0,transparent 30%)}
.app{position:relative;width:min(1050px,100%);margin:auto;padding:24px 14px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px;flex-wrap:wrap}.kicker{color:#e879f9;font-size:12px;font-weight:800;letter-spacing:.28em}.title{margin:4px 0;font-size:clamp(30px,5vw,52px);line-height:1;font-weight:1000;background:linear-gradient(90deg,#fb7185,#fde047,#67e8f9);-webkit-background-clip:text;color:transparent}.sub{margin:8px 0 0;color:#cbd5e1}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{min-width:105px;padding:10px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(12px)}.stat small{display:block;color:#94a3b8;font-weight:700}.stat b{font-size:24px;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:16px}.card{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.28);box-shadow:0 22px 70px rgba(88,28,135,.28);backdrop-filter:blur(12px)}.game-card{padding:14px}.board-wrap{position:relative;width:100%;max-width:680px;aspect-ratio:1;margin:auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#020617}.board-wrap.flash{animation:pop .25s ease}@keyframes pop{50%{transform:scale(1.015)}}canvas{display:block;width:100%;height:100%;touch-action:none;overscroll-behavior:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:26px;text-align:center;background:rgba(2,6,23,.7);backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.milestone{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;font-size:clamp(90px,22vw,190px);font-weight:1000;text-shadow:0 0 18px #22d3ee,0 0 45px #a855f7;animation:milestone 1.15s ease forwards}.milestone[hidden]{display:none}@keyframes milestone{0%{opacity:0;transform:scale(.45)}25%{opacity:1;transform:scale(1.12)}70%{opacity:1}100%{opacity:0;transform:scale(1.35)}}.overlay-box h2{font-size:clamp(28px,5vw,44px);margin:0}.overlay-box p{color:#cbd5e1}.spark{font-size:38px}.btn{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;appearance:none;border:1px solid var(--line);border-radius:13px;padding:12px 15px;color:#fff;background:rgba(255,255,255,.08);font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.btn:hover{background:rgba(255,255,255,.16)}.btn.primary{border:0;border-radius:999px;background:#fff;color:#0f172a;padding:12px 24px}.side{display:flex;flex-direction:column;gap:16px}.panel{padding:17px}.panel h3{margin:0 0 14px}.dpad{width:176px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dpad .btn{height:52px;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.help{color:#cbd5e1;font-size:14px;line-height:1.55}.help ul{margin:0;padding-left:20px}.help li+li{margin-top:8px}.hint{text-align:center;color:#64748b;font-size:12px;margin:14px 0 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.app{padding-top:16px}}@media(max-width:560px){.side{grid-template-columns:1fr}.game-card{padding:7px}.top{align-items:stretch}.stats{width:100%}.stat{flex:1}.title{font-size:32px}.app{padding-inline:8px}}
</style></head>
<body><main class="app"><header class="top"><div><div class="kicker">✦ ARCADE MODE</div><h1 class="title">七色レインボースネーク100</h1><p class="sub">エサを食べて、長く、速く、まぶしく輝こう。</p></div><div class="stats"><div class="stat"><small>🍎 SCORE</small><b id="score">0</b></div><div class="stat"><small>🏆 BEST</small><b id="best">0</b></div><div class="stat"><small>❤️ LIVES</small><b id="lives">3</b></div><div class="stat"><small>⏱ TIME</small><b id="time">00:00.0</b></div></div></header><div class="layout"><section class="card game-card"><div class="board-wrap" id="boardWrap"><canvas id="game" width="800" height="800" aria-label="スネークゲーム"></canvas><div class="milestone" id="milestone" hidden></div><div class="overlay" id="overlay"><div class="overlay-box"><div class="spark">✨</div><h2 id="overlayTitle">レインボースネーク</h2><p id="overlayText">矢印キー、WASD、スワイプ、または方向ボタンでスタート</p><button class="btn primary" id="mainButton">▶ スタート</button></div></div></div></section><aside class="side"><section class="card panel"><h3>ゲーム操作</h3><div class="dpad"><span></span><button class="btn dir" data-dir="up">▲</button><span></span><button class="btn dir" data-dir="left">◀</button><button class="btn dir" data-dir="down">▼</button><button class="btn dir" data-dir="right">▶</button></div><div class="actions"><button class="btn" id="pause">⏸ 停止</button><button class="btn" id="reset">↻ リセット</button></div></section><section class="card panel help"><h3>遊び方</h3><ul><li>⌨️ 矢印 / WASDで移動、Pで一時停止</li><li>💥 壁、自分の胴体、敵に当たると残機が1つ減る。</li><li>🌈 虹色の果実を食べると10秒間パワーアップ。</li><li>✨ パワー中は敵を捕食できます。</li><li>🏆 100ブロックでゲームクリア！</li></ul></section></aside></div><p class="hint">壁や自分の体にぶつかると残機が減ります</p></main>
<script>
(()=>{'use strict';const N=20,c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id),D={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let snake,food,enemies,rainbow,dir,next,status,score,lives,timer,start,elapsed,powerUntil,best=+(localStorage.getItem('rainbow-snake-best')||0),touch;$('best').textContent=best;
function free(){let a=[];for(let y=1;y<N-1;y++)for(let z=1;z<N-1;z++)if(!snake.some(p=>p.x===z&&p.y===y)&&!enemies.some(p=>p.x===z&&p.y===y))a.push({x:z,y});return a[Math.random()*a.length|0]}
function show(t,m,b){$('overlayTitle').textContent=t;$('overlayText').textContent=m;$('mainButton').textContent=b;$('overlay').hidden=false}function time(){let ms=elapsed+(start?Date.now()-start:0),m=ms/60000|0,s=ms%60000/1000|0,d=ms%1000/100|0;$('time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`}
function reset(){clearTimeout(timer);snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];enemies=[{x:14,y:14}];food={x:10,y:10};rainbow=null;dir=next=D.right;status='ready';score=0;lives=3;elapsed=0;start=0;powerUntil=0;$('score').textContent=0;$('lives').textContent=3;time();show('レインボースネーク','矢印キー、WASD、スワイプ、または方向ボタンでスタート','▶ スタート');draw()}
function play(){if(status==='playing'){elapsed+=Date.now()-start;start=0;status='paused';clearTimeout(timer);show('一時停止中','Pキーか再開ボタンで続けよう','▶ 再開');$('pause').textContent='▶ 再開'}else{if(status==='gameover'||status==='won')reset();status='playing';start=Date.now();$('overlay').hidden=true;$('pause').textContent='⏸ 停止';tick()}}
function turn(d){if(dir[0]+d[0]||dir[1]+d[1])next=d;if(status==='ready')play()}
function hit(msg){lives--;$('lives').textContent=lives;if(lives<=0){status='gameover';elapsed+=Date.now()-start;start=0;show('ゲームオーバー',msg+'　スコア '+score,'↻ もう一度');draw();return true}dir=next=[-dir[0],-dir[1]];return false}
function point(){score++;$('score').textContent=score;best=Math.max(best,score);$('best').textContent=best;localStorage.setItem('rainbow-snake-best',best);if(snake.length%10===0){$('milestone').textContent=snake.length;$('milestone').hidden=false;setTimeout(()=>$('milestone').hidden=true,1150)}if(snake.length>=100){score+=100;$('score').textContent=score;status='won';elapsed+=Date.now()-start;start=0;time();show('🌟 GAME CLEAR！ 🌟','100ブロック達成！ ボーナス +100','↻ もう一度');return true}}
function tick(){if(status!=='playing')return;time();dir=next;let h={x:snake[0].x+dir[0],y:snake[0].y+dir[1]},grow=h.x===food.x&&h.y===food.y,rain=rainbow&&h.x===rainbow.x&&h.y===rainbow.y,body=(grow||rain)?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){if(!hit('壁または自分の胴体に衝突しました'))timer=setTimeout(tick,150);return}let ei=enemies.findIndex(p=>p.x===h.x&&p.y===h.y);if(ei>=0){if(Date.now()<powerUntil){enemies.splice(ei,1);snake.unshift(h);point()}else{if(!hit('敵に衝突しました'))timer=setTimeout(tick,150);return}}else{snake.unshift(h);if(grow||rain){point();if(status==='won')return;if(rain){powerUntil=Date.now()+10000;rainbow=null}food=free()}else snake.pop()}if(Math.random()<.012&&!rainbow)rainbow=free();if(Math.random()<.006&&enemies.length<20)enemies.push(free());draw();timer=setTimeout(tick,snake.length>=10?125:155)}
function draw(){let s=c.width/N;x.fillStyle='#020617';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(255,255,255,.045)';for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,c.height);x.stroke();x.beginPath();x.moveTo(0,i*s);x.lineTo(c.width,i*s);x.stroke()}if(food){x.fillStyle='#f43f5e';x.shadowColor='#fb7185';x.shadowBlur=20;x.beginPath();x.arc((food.x+.5)*s,(food.y+.5)*s,s*.27,0,7);x.fill()}if(rainbow){let g=x.createLinearGradient(rainbow.x*s,rainbow.y*s,(rainbow.x+1)*s,(rainbow.y+1)*s);['#ef4444','#eab308','#22c55e','#06b6d4','#8b5cf6'].forEach((q,i,a)=>g.addColorStop(i/(a.length-1),q));x.fillStyle=g;x.shadowColor='#fff';x.shadowBlur=25;x.beginPath();x.arc((rainbow.x+.5)*s,(rainbow.y+.5)*s,s*.33,0,7);x.fill()}enemies.forEach((p,i)=>{x.fillStyle=`hsl(${20+i*47} 90% 58%)`;x.shadowColor=x.fillStyle;x.shadowBlur=18;x.beginPath();x.arc((p.x+.5)*s,(p.y+.5)*s,s*.32,0,7);x.fill();x.fillStyle='#fff';x.fillRect((p.x+.3)*s,(p.y+.35)*s,s*.12,s*.12);x.fillRect((p.x+.58)*s,(p.y+.35)*s,s*.12,s*.12)});snake.forEach((p,i)=>{let hue=(i*24+Date.now()/45)%360;x.fillStyle=Date.now()<powerUntil?`hsl(${hue} 95% 58%)`:'#fb923c';x.shadowColor=x.fillStyle;x.shadowBlur=i?8:16;x.fillRect(p.x*s+s*.08,p.y*s+s*.08,s*.84,s*.84)});x.shadowBlur=0}
const keys={ArrowUp:D.up,w:D.up,W:D.up,ArrowDown:D.down,s:D.down,S:D.down,ArrowLeft:D.left,a:D.left,A:D.left,ArrowRight:D.right,d:D.right,D:D.right};addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();turn(keys[e.key])}else if(e.key.toLowerCase()==='p')play()});document.querySelectorAll('.dir').forEach(b=>b.onclick=()=>turn(D[b.dataset.dir]));$('mainButton').onclick=play;$('pause').onclick=play;$('reset').onclick=reset;c.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length)touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:false});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();if(!touch||!e.changedTouches.length)return;let t=e.changedTouches[0],dx=t.clientX-touch[0],dy=t.clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?D.right:D.left):(dy>0?D.down:D.up))},{passive:false});c.addEventListener('touchcancel',()=>{touch=null});setInterval(()=>{time();if(Date.now()<powerUntil)draw()},100);reset()})();
</script></body></html>
